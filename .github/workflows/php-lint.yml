name: PHP Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          find . -type f -name '*.php' -not -path './storage/*' -print0 \
            | xargs -0 -n1 php -l
